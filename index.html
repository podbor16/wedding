<style>
/* Бумажная открытка: тёплая бумага, бордово-красный, рукописные заголовки, линия от руки через весь день */
:root{
  --desk:#E6E1DB;      /* стол под открыткой (на компьютере) */
  --paper:#F4F0EB;     /* бумага */
  --ink:#231E1E;
  --muted:#6E6563;
  --red:#A3162C;       /* бордово-красный */
  --red-dark:#86101F;
  --red-soft:#F3E2E1;
  --line:#DCD2CB;
  --white:#FFFFFF;
  --danger:#A3162C;
  --script:"Marck Script", "Segoe Script", cursive;
  --text:"Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--text);}
a{color:var(--red)}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:4px}
.card{max-width:460px;margin:0 auto;background:var(--paper);padding:0 22px 40px;text-align:center;overflow:hidden}
@media (min-width:600px){
  body{background:var(--desk)}
  .card{margin:40px auto;box-shadow:0 18px 50px rgba(60,40,35,.18);padding:0 34px 48px}
}
.script{font-family:var(--script);font-weight:400;color:var(--red);line-height:1.1}

/* ---------- имена ---------- */
.names{margin:0;padding:52px 0 0;font:300 34px/1.15 var(--text);color:var(--ink);letter-spacing:.01em}
.names .row{display:block}
.names .row:last-child{padding-left:2.4em}
.names .cap{font-family:var(--script);color:var(--red);font-size:1.9em;line-height:0;vertical-align:-.12em;margin-right:-.04em}
.names .amp{font-family:var(--script);color:var(--red);font-size:1.3em;margin-left:.15em}
.role-title{margin:0;padding:44px 0 0;font:400 30px/1.1 var(--script);color:var(--red)}
.role-title+.names{padding-top:14px}
.block.outline{color:var(--ink)}
.block.outline::before{background:transparent;border:1.5px solid var(--red)}
.block.outline::after{display:none}
.block.outline h2{color:var(--red)}
.block.outline p+p{margin-top:8px}
.witness{padding:36px 0 0}
.yes{margin:10px 0 0;font:400 24px/1.2 var(--script);color:var(--muted);transform:rotate(-3deg)}

/* ---------- письмо ---------- */
.letter{padding:38px 0 6px}
.letter .greet{font:400 34px/1.2 var(--script);color:var(--red);margin:0 0 14px}
.letter p{margin:0 auto 12px;max-width:30em}
.letter .sign{font:400 26px/1.2 var(--script);color:var(--red);margin-top:16px}
.status{color:var(--muted)}

/* ---------- календарь ---------- */
h2{font:400 40px/1.1 var(--script);color:var(--red);margin:0 0 14px}
.month{padding:30px 0 0}
.week{display:grid;grid-template-columns:repeat(7,1fr);row-gap:8px;font:400 14px/1 var(--text);color:var(--muted);letter-spacing:.06em}
.week .d{position:relative;font-size:17px;color:var(--ink);padding:10px 0;font-variant-numeric:tabular-nums}
.week .d.on{color:var(--white);font-weight:600}
.week .d.on svg{position:absolute;left:50%;top:50%;width:52px;height:48px;transform:translate(-50%,-52%);z-index:0;overflow:visible}
.week .d.on span{position:relative;z-index:1}
.countdown{margin:10px 0 0;color:var(--muted);font-size:13px}

/* ---------- день: линия от руки ---------- */
.flow{position:relative;width:100%;aspect-ratio:320/380;margin:-8px auto 0}
.flow svg.squiggle{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.squiggle path{fill:none;stroke:var(--red);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.step{position:absolute;width:58%}
.step .time{font:400 17px/1 var(--text);color:var(--ink)}
.step .what{font:400 34px/1.05 var(--script);color:var(--ink);margin-top:4px}
.step .where{font-size:12.5px;line-height:1.35;color:var(--muted);margin-top:4px}
.step.s0{right:0;top:12%;text-align:center}
.step.s1{left:0;top:55%;text-align:center}
.step.s2{right:0;top:80%;text-align:center}

/* ---------- красные блоки ---------- */
.block{position:relative;color:var(--white);padding:22px 20px 24px;margin:8px 0 0;isolation:isolate}
.block::before{content:"";position:absolute;inset:0;background:var(--red);border-radius:16px;z-index:-1}
.block::after{content:"";position:absolute;inset:6px;border:1px solid rgba(255,255,255,.35);border-radius:12px;pointer-events:none}
.block h2{color:var(--white);margin-bottom:8px}
.block p{margin:0}
.v-place{font-weight:500}
.v-time{opacity:.92}
.v-hint{font-size:13px;opacity:.85;margin-top:8px!important}
.btns{display:grid;gap:10px;margin-top:12px}
.cal{display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border-radius:14px;border:1.5px solid var(--red);background:transparent;color:var(--ink);font:400 14px/1.2 var(--text);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--red-soft)}
.btn.solid{background:var(--red);border-color:var(--red);color:var(--white);font-weight:500}
.btn.solid:hover{background:var(--red-dark)}
.btn[disabled]{opacity:.6;cursor:progress}

.dress{padding:44px 0 0}
.dress p{margin:0 auto;max-width:28em}

/* ---------- анкета ---------- */
.rsvp{padding:44px 0 0}
.rsvp .block{padding-bottom:22px}
.lead{margin:2px 0 0!important;font-size:14px;opacity:.9}
.form-wrap{border:1.5px solid var(--red);border-top:0;border-radius:0 0 16px 16px;margin:-14px 6px 0;padding:30px 16px 20px;text-align:left;background:var(--paper)}
fieldset{border:0;margin:0 0 22px;padding:0}
legend{font:400 26px/1.2 var(--script);color:var(--red);margin:0 0 8px;padding:0}
.person{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.person:first-of-type{border-top:0;padding-top:4px}
.pname{font-weight:500}
.pname small{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:6px;border:1.5px solid var(--line);border-radius:12px;font-size:13.5px;cursor:pointer;user-select:none;line-height:1.2;background:var(--white)}
.seg input:checked+label{border-color:var(--red);background:var(--red);color:var(--white);font-weight:500}
.seg input:focus-visible+label{outline:2px solid var(--red);outline-offset:2px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.extra{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-top:10px}
.check{display:flex;align-items:center;gap:6px;font-size:13.5px;white-space:nowrap}
.check input{width:20px;height:20px;accent-color:var(--red)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--white);color:var(--muted);font-size:20px;cursor:pointer}
input[type=text],textarea{width:100%;font:400 16px/1.4 var(--text);color:var(--ink);padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--white)}
input[type=text]:focus,textarea:focus{border-color:var(--red);outline:none}
textarea{min-height:80px;resize:vertical}
.field{margin:0 0 20px}
.field>label{display:block;font-weight:500;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{padding:8px 13px;border:1.5px solid var(--line);border-radius:999px;font-size:13.5px;cursor:pointer;margin:0;background:var(--white)}
.chips input:checked+label{border-color:var(--red);background:var(--red-soft);color:var(--red-dark)}
.chips input:focus-visible+label{outline:2px solid var(--red);outline-offset:2px}
#send{width:100%}
.error{color:var(--danger);font-size:14px;margin:12px 0 0}
#extrasBox .btns{margin-top:10px}
.done{text-align:center}
.done h3{font:400 34px/1.2 var(--script);color:var(--red);margin:0 0 10px}
.done ul{list-style:none;margin:0 0 14px;padding:0}

footer{padding:44px 0 0;color:var(--muted);font-size:13.5px}
footer .names-s{font:400 30px/1.2 var(--script);color:var(--red);margin:0 0 8px}
footer b{color:var(--ink);font-weight:500}

.demo{position:sticky;top:0;z-index:5;background:var(--ink);color:#EEE7E2;font-size:13px;padding:8px 16px;text-align:left}
.demo .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:460px;margin:0 auto}
.demo button{font:500 12.5px var(--text);padding:6px 10px;border-radius:999px;border:1px solid #7D706C;background:transparent;color:inherit;cursor:pointer}
.demo button[aria-pressed=true]{background:#EEE7E2;color:var(--ink)}
[hidden]{display:none!important}

@media (prefers-reduced-motion:no-preference){
  .squiggle path.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 3s cubic-bezier(.45,.05,.25,1) .3s forwards}
  .week .d.on svg{animation:beat 1.6s ease 1.2s 2}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes beat{0%,100%{transform:translate(-50%,-52%) scale(1)}30%{transform:translate(-50%,-52%) scale(1.12)}}
}
</style>
</head>
<body>

<!-- фильтр «нарисовано от руки» для красных плашек и линий -->

<script>
/* ================= НАСТРОЙКИ =================
   Всё, что может поменяться, — здесь. */
const CONFIG = {
  // фраза под именами
  tagline: "а мы женимся!",
  design: "red",
  // цвет приглашения: "sky" — голубой, "light" — светло-голубой, "rose" — розовый, "green" — зелёный, "gold" — золотой
  palette: "sky",
  // адрес веб-приложения Apps Script (после «Развернуть → Новое развертывание»)
  apiUrl: "https://script.google.com/macros/s/AKfycbzmQbXmy9Qr4LAeplkEGwAAI-QbCi75akPETopO1cmfmIGykNJPu66WrqZEsdoGJ7vIGw/exec",

  date: "2027-08-07",
  steps: [
    {

      main: true
    },
    {

      short: "с самыми близкими, место сообщим позже",
      place: "Место сообщим ближе к дате, по этой же ссылке",
      hint: "",
      map: ""
    }
  ],
  dress: "Никаких правил по нарядам: для нас важнее всего, что вы будете рядом.",
  calendar: { file: "rospis.ics", start: "20270807T090000Z", end: "20270807T110000Z",
              title: "Роспись Матвея и Златы", location: "Красноярск, проспект Мира, 24Г, Дом семейных торжеств" },
  drinks: ["Шампанское", "Белое вино", "Красное вино", "Крепкое", "Не пью алкоголь"],
  contacts: [
    { name: "Матвей", phone: "+79535965936", phoneText: "+7 953 596-59-36", telegram: "podbor_16" },
    { name: "Злата",  phone: "+79283301173", phoneText: "+7 928 330-11-73", telegram: "zlatyssya" }
  ]
};

const PALETTE_BAR = { sky:"#A6DDF5", light:"#E3F3FF", rose:"#FAE3E8", green:"#DCF7DC", gold:"#EBD9A6" };
function applyPalette(name){
  document.documentElement.dataset.palette = name;
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = PALETTE_BAR[name] || PALETTE_BAR.sky;
}
applyPalette(CONFIG.palette);

const DEMO = {
  pair: { ok:true, code:"DEMO", appeal:"Анна и Дмитрий", tone:"вы", seats:3,
          events:{rospis:true, svadba:true},
          people:[{name:"Анна Иванова"},{name:"Дмитрий Иванов"}], menu:"", drinks:"", comment:"" },
  solo: { ok:true, code:"DEMO", appeal:"Егор", tone:"ты", seats:1,
          events:{rospis:true, svadba:true},
          people:[{name:"Егор Пеньков"}], menu:"", drinks:"", comment:"" },
  witness: { ok:true, code:"DEMO", appeal:"Катя", tone:"ты", seats:2,
          events:{rospis:true, svadba:true}, role:"свидетельница", roleName:"Катя (Питер)", witnessInfo:"",
          people:[{name:"Катя (Питер)", role:"свидетельница"}], menu:"", drinks:"", comment:"" }
};

/* ================= ТЕКСТЫ ================= */
function voice(inv){
  const plural = inv.people.length > 1 || /,| и /.test(inv.appeal || "");
  if (plural) return {plural, greet:`Дорогие ${inv.appeal}!`, you:"вы", youGen:"вас", youIns:"вами",
    answer:"ответьте", can:"сможете", come:"придёте", your:"Ваш ответ", write:"впишите", tell:"напишите", mark:"отметьте", change:"поменяйте"};
  if (inv.tone === "ты") return {plural, greet:`Привет, ${inv.appeal}!`, you:"ты", youGen:"тебя", youIns:"тобой",
    answer:"ответь", can:"сможешь", come:"придёшь", your:"Твой ответ", write:"впиши", tell:"напиши", mark:"отметь", change:"поменяй"};
  return {plural, greet:`Здравствуйте, ${inv.appeal}!`, you:"Вы", youGen:"Вас", youIns:"Вами",
    answer:"ответьте", can:"сможете", come:"придёте", your:"Ваш ответ", write:"впишите", tell:"напишите", mark:"отметьте", change:"поменяйте"};
}
const ANSWER_LABELS = [["Придёт","Буду"],["Не придёт","Не смогу"],["Под вопросом","Пока не знаю"]];

/* ================= УТИЛИТЫ ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shortName = n => String(n).replace(/\s*\(.*?\)\s*/g," ").trim();
const plural = (n, one, few, many) => {
  const m10 = n % 10, m100 = n % 100;
  return (m10 === 1 && m100 !== 11) ? one : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? few : many;
};

function jsonp(url, params){
  return new Promise((resolve, reject) => {
    const cb = "cb" + Math.random().toString(36).slice(2);
    const q = new URLSearchParams({...params, callback: cb, t: Date.now()});
    const s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 15000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error("network")); };
    s.src = url + (url.includes("?") ? "&" : "?") + q;
    document.head.appendChild(s);
  });
}

/* ================= СТАТИЧНЫЕ БЛОКИ ================= */
function renderStatic(){
  $("#tagline").textContent = CONFIG.tagline || "";
  $("#tagline").hidden = !CONFIG.tagline;
  const days = Math.ceil((new Date(CONFIG.date + "T16:00:00+07:00") - Date.now()) / 864e5);
  $("#countdown").textContent = days > 0 ? `до росписи ${days} ${plural(days,"день","дня","дней")}` : "";

  // день: шаги вдоль нарисованной от руки линии
  $("#day").innerHTML = CONFIG.steps.map((s, i) => `
    <div class="step s${i}">
      <div class="time">${esc(s.time)}</div>
      <div class="what">${esc(s.title)}</div>
      ${s.short ? `<div class="where">${esc(s.short)}</div>` : ""}
    </div>`).join("");
  const main = CONFIG.steps.find(s => s.main) || CONFIG.steps[0];
  $("#venue").innerHTML = `
    <p class="v-place">${esc(main.place)}</p>
    ${main.hint ? `<p class="v-hint">${esc(main.hint)}</p>` : ""}`;
  $("#venueBtns").innerHTML = `
    ${main.map ? `<a class="btn wide" href="${esc(main.map)}" target="_blank" rel="noopener">Посмотреть на карте</a>` : ""}
    <span id="cal" class="cal"></span>`;
  $("#dress").textContent = CONFIG.dress;

  // Календарь: iPhone открывает файл .ics сразу в «Календаре» (файл лежит рядом с index.html),
  // Android — Google Календарь, компьютер — обе кнопки.
  const c = CONFIG.calendar;
  const gcal = "https://calendar.google.com/calendar/render?" + new URLSearchParams({
    action: "TEMPLATE", text: c.title, dates: `${c.start}/${c.end}`,
    location: c.location, details: "Приглашение: " + location.origin + location.pathname
  });
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);
  const cal = $("#cal");
  if (cal) cal.innerHTML = isIOS
    ? `<a class="btn wide" href="${c.file}">Добавить в календарь</a>`
    : isAndroid
      ? `<a class="btn wide" href="${esc(gcal)}" target="_blank" rel="noopener">Добавить в календарь</a>`
      : `<a class="btn wide" href="${esc(gcal)}" target="_blank" rel="noopener">Добавить в календарь</a>`;

  const cs = CONFIG.contacts.filter(x => x.phone || x.telegram);
  $("#contacts").innerHTML = cs.length
    ? `Если остались вопросы, пишите или звоните:<br>` + cs.map(x => [
        `<b>${esc(x.name)}</b>`,
        x.phone ? `<a href="tel:${esc(x.phone)}">${esc(x.phoneText || x.phone)}</a>` : "",
        x.telegram ? `<a href="https://t.me/${esc(x.telegram)}" target="_blank" rel="noopener">Telegram</a>` : ""
      ].filter(Boolean).join(", ")).join("<br>")
    : "Красноярск, 7 августа 2027";
}

/* ================= ПРИГЛАШЕНИЕ ================= */
let INV = null;

function renderLetter(state){
  const box = $("#letter");
  if (state === "nocode" || state === "notfound" || state === "offline"){
    const text = {
      nocode: "Это приглашение на нашу роспись. Отправить ответ можно по личной ссылке из нашего сообщения.",
      notfound: "Не нашли приглашение по этой ссылке. Проверьте, что ссылка скопирована целиком, или напишите нам.",
      offline: "Не получилось загрузить ваше приглашение. Проверьте интернет и обновите страницу."
    }[state];
    $("#roleTitle").hidden = true; $("#witness").hidden = true;
    box.innerHTML = `<p class="greet">7 августа мы станем мужем и женой</p><p>${text}</p>`;
    $("#rsvp").hidden = true;
    return;
  }
  const v = voice(INV);
  renderWitness(v);
  if (!INV.events.rospis){
    box.innerHTML = `<p class="greet">${esc(v.greet)}</p>
      <p>Свадьбу мы празднуем летом 2028 года, и ${v.you} в списке наших гостей. Подробности появятся по этой же ссылке ближе к дате.</p>`;
    $("#rsvp").hidden = true;
    return;
  }
  const wait = document.querySelector('[aria-label="Место"] h2');
  if (wait) wait.textContent = v.you === "ты" ? "Ждём тебя!" : (v.you === "Вы" ? "Ждём Вас!" : "Ждём вас!");
  box.innerHTML = `
    <p class="greet">${esc(v.greet)}</p>
    <p>7 августа 2027 года мы станем мужем и женой. Нам очень хочется разделить этот день с ${v.youIns}: сначала регистрация, а потом ужин в кругу самых близких.</p>
    ${witnessAsk(v)}
    <p>Ниже можно отметить, ${v.can} ли ${v.you} прийти. Если планы потом поменяются, ответ можно будет изменить по этой же ссылке.</p>`;
  renderForm();
}

/* ---------- свидетели ---------- */
function witnessAsk(v){
  if (!INV || !INV.role) return "";
  const female = INV.role === "свидетельница";
  const noun = female ? "нашей свидетельницей" : "нашим свидетелем";
  if (v.plural){
    const first = shortName(INV.roleName || "").split(" ")[0];
    return `<p>А ещё, ${esc(first)}, у нас к тебе особенная просьба: мы очень хотим, чтобы именно ты ${female ? "стала" : "стал"} ${noun}.</p>`;
  }
  const dat = v.you === "ты" ? "тебе" : (v.you === "Вы" ? "Вам" : "вам");
  const verb = v.you === "ты" ? (female ? "стала" : "стал") : "стали";
  return `<p>И у нас к ${dat} особенная просьба: мы очень хотим, чтобы именно ${v.you} ${verb} ${noun}.</p>`;
}
function renderWitness(v){
  const on = !!(INV && INV.role);
  $("#roleTitle").hidden = !on;
  $("#witness").hidden = !on;
  if (!on) return;
  const female = INV.role === "свидетельница";
  $("#roleTitle").textContent = female ? "Приглашение для свидетельницы" : "Приглашение для свидетеля";
  $("#witnessTitle").textContent = v.plural ? (female ? "Для свидетельницы" : "Для свидетеля")
    : (v.you === "ты" ? "Только для тебя" : (v.you === "Вы" ? "Только для Вас" : "Только для вас"));
  const info = String(INV.witnessInfo || "").trim();
  const whom = v.plural ? "" : (v.you === "ты" ? " для тебя" : (v.you === "Вы" ? " для Вас" : " для вас"));
  $("#witnessText").innerHTML = info
    ? info.split(/\n+/).map(x => `<p>${esc(x)}</p>`).join("")
    : `<p>Подробности${whom} мы добавим чуть позже. Они появятся здесь, по этой же ссылке.</p>`;
}

function renderForm(){
  const v = voice(INV);
  $("#rsvp").hidden = false;
  $("#done").hidden = true;
  const form = $("#form");
  form.hidden = false;
  $("#rsvpTitle").textContent = v.your;
  $("#rsvpLead").textContent = v.plural ? "Отметьте, пожалуйста, за каждого." : "";
  $("#rsvpLead").hidden = !v.plural;

  const ansKey = CONFIG.event === "svadba" ? "answerSvadba" : "answerRospis";
  const original = INV.people.filter(p => !p.fromSite);
  // в форме — только те, кого зовём на это событие
  const main = original.filter(p => CONFIG.event === "svadba" ? p.svadba !== false : p.rospis !== false);
  const extras = INV.people.filter(p => p.fromSite);
  const freeSeats = Math.max(0, (INV.seats || 0) - original.length);

  const personRow = (p, i) => `
    <div class="person">
      <div class="pname">${esc(shortName(p.name))}${p.child ? "<small>ребёнок</small>" : ""}</div>
      <div class="seg" role="radiogroup" aria-label="${esc(shortName(p.name))}">
        ${ANSWER_LABELS.map(([val,label], j) => `
          <input type="radio" id="p${i}_${j}" name="p${i}" value="${val}" ${p[ansKey] === val ? "checked" : ""}>
          <label for="p${i}_${j}">${label}</label>`).join("")}
      </div>
    </div>`;

  const selected = String(INV.drinks || "").split(/,\s*/).filter(Boolean);
  form.innerHTML = `
    <fieldset>
      <legend>${v.plural ? "Кто придёт" : `${v.you === "ты" ? "Придёшь" : "Придёте"}?`}</legend>
      ${main.map(personRow).join("")}
    </fieldset>

    ${freeSeats ? `
    <fieldset id="extrasBox">
      <legend>${v.plural ? "Придёте не одни?" : (v.you === "ты" ? "Придёшь не один?" : "Придёте не одни?")}</legend>
      <p class="hint" style="margin-top:-6px">В приглашении есть место ещё для ${freeSeats} ${plural(freeSeats,"человека","человек","человек")}. ${v.write[0].toUpperCase()+v.write.slice(1)} имя и фамилию, чтобы мы подготовили место.</p>
      <div id="extras"></div>
      <div class="btns"><button type="button" class="btn" id="addExtra">Добавить спутника или ребёнка</button></div>
    </fieldset>` : ""}

    <div class="field">
      <label for="menu">Ограничения в еде или аллергии</label>
      <textarea id="menu" maxlength="500" placeholder="Например: не ем мясо, аллергия на орехи">${esc(INV.menu)}</textarea>
    </div>

    <div class="field">
      <label id="drinksLbl">Что ${v.you === "ты" ? "предпочитаешь" : "предпочитаете"} пить на ужине</label>
      <div class="chips" role="group" aria-labelledby="drinksLbl">
        ${CONFIG.drinks.map((d,i) => `<input type="checkbox" id="d${i}" value="${esc(d)}" ${selected.includes(d) ? "checked" : ""}><label for="d${i}">${esc(d)}</label>`).join("")}
      </div>
    </div>

    <div class="field">
      <label for="comment">Пожелания или вопросы</label>
      <textarea id="comment" maxlength="1000">${esc(INV.comment)}</textarea>
    </div>

    <button type="submit" class="btn solid" id="send">Отправить ответ</button>
    <p class="error" id="err" role="alert" hidden></p>`;

  if (freeSeats){
    const box = $("#extras");
    const add = (name = "", child = false) => {
      if (box.children.length >= freeSeats) return;
      const row = document.createElement("div");
      row.className = "extra";
      row.innerHTML = `
        <input type="text" placeholder="Имя и фамилия" aria-label="Имя и фамилия гостя" value="${esc(name)}" maxlength="80">
        <label class="check"><input type="checkbox" ${child ? "checked" : ""}> ребёнок</label>
        <button type="button" class="icon-btn" aria-label="Убрать">×</button>`;
      row.querySelector(".icon-btn").onclick = () => { row.remove(); sync(); };
      box.appendChild(row);
      sync();
      if (!name) row.querySelector("input").focus();
    };
    const sync = () => { $("#addExtra").hidden = box.children.length >= freeSeats; };
    $("#addExtra").onclick = () => add();
    extras.filter(p => p[ansKey] !== "Не придёт").forEach(p => add(p.name, p.child));
    sync();
  }

  form.onsubmit = e => { e.preventDefault(); submit(main); };
}

async function submit(main){
  const ansKey = CONFIG.event === "svadba" ? "answerSvadba" : "answerRospis";
  const err = $("#err");
  err.hidden = true;
  const people = main.map((p, i) => ({ name: p.name, answer: (document.querySelector(`input[name=p${i}]:checked`) || {}).value }));
  if (people.some(p => !p.answer)){
    err.textContent = people.length > 1 ? "Отметьте ответ для каждого из приглашения." : "Выберите один из вариантов ответа.";
    err.hidden = false;
    return;
  }
  const extras = [...document.querySelectorAll("#extras .extra")].map(r => ({
    name: r.querySelector("input[type=text]").value.trim(),
    child: r.querySelector("input[type=checkbox]").checked,
    answer: "Придёт"
  })).filter(x => x.name);
  const payload = {
    code: INV.code, event: CONFIG.event, people, extras,
    menu: $("#menu").value.trim(),
    drinks: [...document.querySelectorAll(".chips input:checked")].map(x => x.value),
    comment: $("#comment").value.trim()
  };

  const btn = $("#send");
  btn.disabled = true; btn.textContent = "Отправляем…";
  try {
    if (CONFIG.apiUrl && INV.code !== "DEMO"){
      await fetch(CONFIG.apiUrl, { method:"POST", mode:"no-cors",
        headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
      // ответ no-cors не читается — перечитываем приглашение и сверяем
      const fresh = await jsonp(CONFIG.apiUrl, { g: INV.code });
      const saved = fresh.ok && people.every(p => (fresh.people.find(x => x.name === p.name) || {})[ansKey] === p.answer);
      if (!saved) throw new Error("not saved");
      INV = fresh;
    } else {
      await new Promise(r => setTimeout(r, 600));
      people.forEach(p => { const x = INV.people.find(y => y.name === p.name); if (x) x[ansKey] = p.answer; });
      INV.people = INV.people.filter(p => !p.fromSite).concat(extras.map(x => ({ name:x.name, child:x.child, fromSite:true, [ansKey]:"Придёт" })));
      Object.assign(INV, { menu: payload.menu, drinks: payload.drinks.join(", "), comment: payload.comment });
    }
    showDone(people, extras);
  } catch (e) {
    err.textContent = "Не получилось отправить ответ. Проверьте интернет и нажмите «Отправить ответ» ещё раз. Если не выходит, напишите нам.";
    err.hidden = false;
  } finally {
    btn.disabled = false; btn.textContent = "Отправить ответ";
  }
}

function showDone(people, extras){
  const v = voice(INV);
  const label = val => ({ "Придёт":"будет", "Не придёт":"не сможет", "Под вопросом":"пока не знает" })[val];
  const anyone = people.some(p => p.answer === "Придёт");
  $("#form").hidden = true;
  const d = $("#done");
  d.hidden = false;
  d.innerHTML = `<div class="done">
    <h3>${anyone ? "Спасибо, ждём!" : "Спасибо, что ответили"}</h3>
    <ul>
      ${people.map(p => `<li>${esc(shortName(p.name))}: ${label(p.answer)}</li>`).join("")}
      ${extras.map(x => `<li>${esc(x.name)}${x.child ? " (ребёнок)" : ""}: будет</li>`).join("")}
    </ul>
    <p class="hint" style="margin:0 0 14px">Если планы изменятся, ${v.change} ответ здесь или ${v.tell} нам.</p>
    <button type="button" class="btn" id="edit">Изменить ответ</button>
  </div>`;
  $("#edit").onclick = () => { renderForm(); $("#rsvp").scrollIntoView({behavior:"smooth"}); };
  d.scrollIntoView({behavior:"smooth", block:"center"});
}

/* ================= ЗАПУСК ================= */
async function load(){
  renderStatic();
  const code = (new URLSearchParams(location.search).get("g") || "").trim().toUpperCase();
  const demo = !CONFIG.apiUrl || code === "DEMO";
  if (demo){
    const bar = $("#demoBar");
    bar.hidden = false;
    const show = key => {
      bar.querySelectorAll("button[data-demo]").forEach(b => b.setAttribute("aria-pressed", b.dataset.demo === key));
      if (key === "nocode") return renderLetter("nocode");
      INV = JSON.parse(JSON.stringify(DEMO[key]));
      renderLetter("ok");
    };
    bar.querySelectorAll("button[data-demo]").forEach(b => b.onclick = () => show(b.dataset.demo));
    const tag = t => { $("#tagline").textContent = t; $("#tagline").hidden = false;
      bar.querySelectorAll("button[data-tag]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tag === t)); };
    bar.querySelectorAll("button[data-tag]").forEach(b => b.onclick = () => tag(b.dataset.tag));
    tag(CONFIG.tagline);
    const pal = key => { applyPalette(key); bar.querySelectorAll("button[data-pal]").forEach(b => b.setAttribute("aria-pressed", b.dataset.pal === key)); };
    bar.querySelectorAll("button[data-pal]").forEach(b => b.onclick = () => pal(b.dataset.pal));
    pal(CONFIG.palette);
    return show("pair");
  }
  if (!code) return renderLetter("nocode");
  try {
    const data = await jsonp(CONFIG.apiUrl, { g: code });
    if (!data.ok) return renderLetter(data.error === "not_found" ? "notfound" : "offline");
    INV = data;
    renderLetter("ok");
  } catch (e) {
    renderLetter("offline");
  }
}

// длина линии реки для анимации
document.querySelectorAll(".squiggle path.draw").forEach(p => p.style.setProperty("--len", p.getTotalLength()));
load();
</script>
